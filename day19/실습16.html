        <h3> 회원가입 영역 </h3>

        <input class="signPw" type="password" placeholder="비밀번호를 입력하세요" /> <br />

    <div>

        <input class="loginPw" type="password" placeholder="비밀번호를 입력하세요" /> <br />
        <button onclick="login()"> 로그인 </button>
    </div>
    <!-- JS 파일 호출은 body 마크업 가장 하단에서.-->
